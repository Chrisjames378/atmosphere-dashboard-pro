<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atmosphere Dashboard Pro</title>
    <meta name="theme-color" content="#0f172a" />
    <script>
      // Global suppression for injected browser extension & WebSocket rejections
      (function() {
        function isWalletOrExtensionError(err) {
          if (!err) return false;
          var str = '';
          try {
            if (typeof err === 'string') str = err;
            else if (err.message) str = err.message;
            else if (err.reason) str = typeof err.reason === 'string' ? err.reason : (err.reason.message || String(err.reason));
            else str = String(err) + ' ' + JSON.stringify(err);
          } catch (e) {
            str = String(err);
          }
          return /MetaMask|ethereum|web3|WebSocket|websocket|restoring session|Failed to connect/i.test(str);
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isWalletOrExtensionError(event.reason) || isWalletOrExtensionError(event)) {
            event.preventDefault();
            if (event.stopPropagation) event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isWalletOrExtensionError(event.message) || isWalletOrExtensionError(event.error) || isWalletOrExtensionError(event)) {
            event.preventDefault();
            if (event.stopPropagation) event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.onunhandledrejection = function(event) {
          if (isWalletOrExtensionError(event.reason) || isWalletOrExtensionError(event)) {
            return true;
          }
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
